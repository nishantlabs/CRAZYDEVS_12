<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StadiumGuide | Custom Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Base Layer: Map -->
    <div id="map-layer"></div>

    <!-- Live Scoreboard Widget -->
    <div id="live-scoreboard" class="live-scoreboard">
      <div class="score-header">
        <span class="live-dot"></span> LIVE: IND vs AUS
      </div>
      <div class="score-main">
        <div class="team-score">IND <strong>145/2</strong> <span class="overs">(14.2)</span></div>
      </div>
    </div>

    <!-- Bottom Controls Container (Match sketch) -->
    <div class="bottom-controls">
      <div class="search-box">
        <input type="text" placeholder="Search..." id="search-input" />
        <button class="mic-button" aria-label="Voice Search" id="voice-search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>
      </div>
      <button class="primary-btn" id="start-nav-btn">
        <span id="btn-text">Direct To...</span>
      </button>
    </div>

    <script src="./main.js" defer></script>
  </body>
</html>
