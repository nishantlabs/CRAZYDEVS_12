<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="StadiumGuide - Your smart stadium companion." />
    <title>StadiumGuide | Smart Stadium Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-CE9irEaR.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BgE_W06S.css">
  </head>
  <body>
    <!-- Base Layer: Map -->
    <div id="map-layer">
      <!-- Decorative Neon Path SVG -->
      <svg class="neon-path-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 20,80 Q 50,50 80,20" class="neon-line"></path>
        <circle cx="20" cy="80" r="3" class="user-pin"></circle>
        <circle cx="80" cy="20" r="3" class="destination-pin"></circle>
        <text x="85" y="18" fill="white" font-size="4" font-family="Inter, sans-serif">Gate 7</text>
      </svg>
    </div>

    <!-- Alert Toast -->
    <div id="alert-toast" class="hidden">
      <span class="toast-icon">🏏</span>
      <span class="toast-message"><strong>WICKET!</strong> Virat Kohli - 54(38)</span>
    </div>

    <!-- Header: Search Bar -->
    <header class="header-container">
      <div class="search-bar">
        <input type="text" placeholder="Ask me anything in English, Hindi, or Marathi..." class="search-input" id="search-input" />
        <button class="mic-button" aria-label="Voice Search" id="voice-search-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
          <span class="pulse-ring"></span>
        </button>
      </div>
    </header>

    <!-- Control Widgets -->
    <div class="control-widgets">
      <button class="widget-btn notification-btn" aria-label="Notifications" id="notification-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="red-dot"></span>
      </button>
      <button class="widget-btn location-btn" aria-label="My Location" id="location-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
      </button>
      <div class="language-toggle">
        <button class="lang-chip active" id="lang-en">EN</button>
        <button class="lang-chip" id="lang-hi">हि</button>
        <button class="lang-chip" id="lang-mr">म</button>
      </div>
    </div>

    <!-- Interaction Layer: Bottom Sheet -->
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <div class="sheet-header">
          <h1 class="sheet-title">Vada Pav Stall - Stand C</h1>
          <span class="badge">🚶 3 min walk</span>
        </div>
        <button class="primary-btn" id="start-nav-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
          Start Navigation
        </button>
      </div>
    </div>

  </body>
</html>
